# Edit this file to match your Malcolm GCS hardware and operating frequency.
# After editing, restart all Malcolm services for changes to take effect.

# ---------------------------------------------------------------------------
# MAVLink source (mavlink-router output to host PC)
# ---------------------------------------------------------------------------
mavlink:
  # Source string for pymavlink mavutil.mavlink_connection()
  # Options:
  #   "udpin:localhost:14550"       — mavlink-router UDP output (default)
  #   "/dev/ttyACM0,115200"         — USB serial direct to PB2-I
  source: "udpin:localhost:14550"

  aircraft_sysid: 1     # Must match MAL_AIRCRAFT_SYS_ID in mal_config.h
  gcs_sysid:     255    # Must match MAL_MAVLINK_SYS_ID in mal_config.h

# ---------------------------------------------------------------------------
# Tracker (tracker.py configuration)
# ---------------------------------------------------------------------------
tracker:
  # UDP port where tracker.py listens for aircraft position from PB2-I
  telemetry_port: 14560

  # UDP port where tracker.py publishes gimbal targets to gimbal_ctrl.py
  gimbal_port: 14570

  # Position update rate (Hz)
  update_hz: 5.0

# ---------------------------------------------------------------------------
# Gimbal controller (gimbal_ctrl.py configuration)
# ---------------------------------------------------------------------------
gimbal_ctrl:
  # UDP port where gimbal_ctrl.py listens for targets from tracker.py
  gimbal_port: 14570

  # PB2-I USB CDC-ECM IP address
  pb2i_host: "192.168.7.2"

  # UDP port on PB2-I for receiving GIMBAL_TARGET commands
  pb2i_cmd_port: 14571

# ---------------------------------------------------------------------------
# GNSS receiver (GCS position fix — feeds tracker.py)
# ---------------------------------------------------------------------------
gnss:
  # Serial device for u-blox GNSS receiver (udev symlink recommended)
  # Set up udev rule: /etc/udev/rules.d/99-gnss.rules
  #   SUBSYSTEM=="tty", ATTRS{idVendor}=="1546", SYMLINK+="gnss_gcs"
  device: "/dev/gnss_gcs"
  baud: 115200

# ---------------------------------------------------------------------------
# WiFi transmit power (FCC EIRP compliance)
# ---------------------------------------------------------------------------
wifi:
  # Transmit power in mBm (millidBm) when 14 dBi panel antenna is connected.
  # 17 dBm = 1700 mBm.  Reduces to 17 dBm to stay within 30 dBm EIRP limit.
  # See malcolm_antenna_spec.md Link 3 for calculation.
  tx_power_mbm: 1700

  # Wireless interface name
  iface: "wlan0"

# ---------------------------------------------------------------------------
# 49 MHz RCRS configuration (mirrors mal_config.h values)
# ---------------------------------------------------------------------------
rcrs:
  # RCRS channel (0–4 → 49.830, 49.845, 49.860, 49.875, 49.890 MHz)
  # Must match aircraft River/Simon channel assignments.
  default_channel: 0
