#
# mavlink-router routes MAVLink frames between Malcolm's PB2-I radio
# interfaces and the host PC applications (QGroundControl, tracking software).
#
# Reference: https://github.com/mavlink-router/mavlink-router

# ---------------------------------------------------------------------------
# General settings
# ---------------------------------------------------------------------------
[General]
# Minimum MAVLink heartbeat interval (ms) below which a link is considered lost
HeartbeatTimeout=5000

# TCP port for QGC connection (alternative to UDP)
TcpServerPort=5760

# ---------------------------------------------------------------------------
# PB2-I USB CDC-ECM → host link
# The PB2-I appears as a USB Ethernet adapter (usb0, 192.168.7.2).
# mavlink-router receives MAVLink from PB2-I on this UDP endpoint.
# ---------------------------------------------------------------------------
[UdpEndpoint pb2i_comms]
Mode=Normal
Address=192.168.7.2
Port=14551

# ---------------------------------------------------------------------------
# QGroundControl on host PC (localhost UDP 14550)
# ---------------------------------------------------------------------------
[UdpEndpoint qgc]
Mode=Normal
Address=127.0.0.1
Port=14550

# ---------------------------------------------------------------------------
# Tracking software input (telemetry_feed.py and tracker.py)
# ---------------------------------------------------------------------------
[UdpEndpoint tracking]
Mode=Normal
Address=127.0.0.1
Port=14552

# ---------------------------------------------------------------------------
# Optional: SiK radio direct USB serial fallback
# Enable if PB2-I is unavailable and SiK is connected directly via USB adapter.
# Comment out when PB2-I is in use to avoid duplicate MAVLink streams.
# ---------------------------------------------------------------------------
#[UartEndpoint sik_direct]
#Device=/dev/ttyUSB0
#Baud=57600

# ---------------------------------------------------------------------------
# Optional: LoRa direct serial fallback (same note as SiK above)
# ---------------------------------------------------------------------------
#[UartEndpoint lora_direct]
#Device=/dev/ttyUSB1
#Baud=57600
