# Inherits the repo-root CPPLINT.cfg. test_crypto.c carries published known-answer
# vectors whose lines end in a same-line "DevSkim: ignore" suppression (DevSkim does not
# honour the suppression on a neighbouring line), which pushes those lines past 80
# columns. clang-format is held off for exactly those tables, so relax only the
# line-length category for this directory.
filter=-whitespace/line_length
