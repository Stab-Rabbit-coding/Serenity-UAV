version = 1
# REUSE Specification 3.2 (FSFE, https://reuse.software/spec-3.2/) — machine-
# readable licensing for files that cannot carry, or may lose, a header line.
#
# Owner rule 2026-10-04: images (SVG, PNG, JPG, WebP and every other image
# format) are DOCUMENTS and carry CC BY-SA 4.0 — including renders and figures
# produced by hardware tools.  Original raster images also carry the licence in
# their embedded XMP metadata; SVGs carry it in a header comment.  This file
# keeps regenerated images covered even if a generator drops that metadata.
#
# Third-party material is NOT covered by these annotations: everything under
# docs/references/ and docs/ideation/7-2.webp (QX-Motor vendor manual page)
# keeps its upstream terms — see REFERENCES.md.  archives/ is historical and
# out of scope.

[[annotations]]
# Only the project's own image folders are listed — REUSE globs cannot exclude,
# so a repo-wide "**/*.png" would wrongly claim the third-party images under
# docs/references/.  Add a folder here when original images land elsewhere.
