# cpplint configuration for the Serenity UAV firmware sources.
#
# cpplint enforces the Google C++ Style Guide, which this project's firmware
# (plain C, not C++) cannot and should not fully satisfy. Filtered categories,
# each confirmed via the actual CI run (ci.yml has no dedicated cpplint job;
# github/super-linter@v4's CLANG_FORMAT + CPP checks are the only place this
# runs -- see super-linter.yml):
#
#   build/header_guard   -- wants full-path guards (e.g.
#     AVIONICS_FIRMWARE_CN_SRC_SI5351_H_). This project uses short,
#     symbol-only header guards (SI5351_H) consistently across every header
#     in the repo; that's the established convention, not an oversight.
#   build/include_subdir -- wants "#include <subdir/header.h>" for local
#     headers. This project's CMake targets add each module's own src/
#     directory to the include path, so peer headers are included by bare
#     filename (matches CLAUDE.md/AGENTS.md's C coding conventions already
#     in place repo-wide); changing this would require restructuring the
#     actual build include paths, not just the #include lines.
#   build/include_order  -- assumes every foo.c has a matching foo.h as its
#     "primary" header, then grades system-header ordering relative to it.
#     Several files here are leaf application entry points (main.c) with no
#     matching main.h -- they legitimately just #include their dependency's
#     header (e.g. xcvr_kiss.h), which cpplint then misclassifies the
#     ordering of.
#   runtime/int           -- wants int16_t/int32_t/int64_t instead of the C
#     type `long`. Every `long` in this codebase is the standard C library's
#     own strtol()/strtoul() return type -- using a fixed-width type there
#     would just require casting the library's own API, for no benefit.
#
# Not filtered: legal/copyright (files carry a Copyright line in their
# header block); readability/casting doesn't need filtering -- it would
# require C++-only static_cast/reinterpret_cast syntax, which isn't valid C,
# but empirically doesn't fire against this codebase's C-style casts;
# whitespace/parens and readability/multiline_comment were resolved directly
# in source (reflowed one wrapped Doxygen comment under 80 columns).
filter=-build/header_guard,-build/include_subdir,-build/include_order,-runtime/int
