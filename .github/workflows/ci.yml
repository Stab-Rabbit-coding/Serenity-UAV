name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run flake8
        run: |
          flake8 --version
          flake8 --exclude=archives,graphical-build-guide,avionics/kicad,airframe/FreeCAD-scripts,airframe/blender-scripts .

  clang-format:
    name: C/C++ format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install pinned clang-format
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          clang-format --version
      - name: Run clang-format (dry-run, authoritative pinned version)
        run: |
          find . \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' -o -name '*.cc' \) \
            -not -path './archives/*' -not -path './airframe/archive/*' \
            -not -path './airframe/FreeCAD-scripts/*' -print0 \
            | xargs -0 clang-format --dry-run --Werror

  stl-validate:
    name: STL Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install dev requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Run STL validator
        run: |
          python tools/validate_stls.py

  kicad-validate:
    name: KiCad Validation
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history + must be able to resolve origin/main for the
          # --changed-since diff scope (see tools/validate_kicad.py).
          fetch-depth: 0
      - name: Install kicad-cli
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-9.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli --version
      - name: Run KiCad ERC/DRC validator (changed files only)
        run: |
          git fetch origin main
          python3 tools/validate_kicad.py --changed-since origin/main --verbose

  # PROJECT_INDEX.md / ARCHIVE_INDEX.md / tools/index_tags.json are generated
  # build output.  They are kept current AUTOMATICALLY by .githooks/pre-commit,
  # which regenerates and stages them on every commit; this job is the backstop
  # that verifies it happened.
  #
  # Since tools/precommit_index.py indexes only git-TRACKED files, its output is a
  # deterministic function of the commit — a fresh CI clone, a developer clone
  # full of untracked KiCad backups and sliced gcode, and a linked git worktree
  # all produce byte-identical output.  Before that (2026-08) this job failed
  # repeatedly on differences that were artefacts of WHERE the generator ran, not
  # of the commit, which is what made it feel like it "randomly" broke CI.
  #
  # DELIBERATELY NOT AUTO-COMMITTING THE FIX: pushing a correction from CI would
  # need GITHUB_TOKEN, and pushes made with GITHUB_TOKEN do not trigger new
  # workflow runs by design.  The corrected head commit would therefore arrive
  # with the ruleset's required checks ("Python lint", "STL Validation") missing
  # and the PR would be unmergeable — strictly worse than a clear failure.  If an
  # auto-fix is wanted later it needs a PAT or GitHub App token in secrets, which
  # is a credential decision for a human to make.
  index-check:
    name: Project/Archive Index sync
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Verify PROJECT_INDEX.md / ARCHIVE_INDEX.md / index_tags.json are in sync
        run: |
          if python3 tools/precommit_index.py --check; then
            exit 0
          fi
          echo "::group::Regenerated output vs committed"
          python3 tools/precommit_index.py >/dev/null
          git --no-pager diff --stat -- PROJECT_INDEX.md ARCHIVE_INDEX.md tools/index_tags.json
          echo "::endgroup::"
          cat <<'EOF'
          ::error::Generated indexes are stale.

          Fix (one command, from the repo root):

              python3 tools/precommit_index.py && git add PROJECT_INDEX.md ARCHIVE_INDEX.md tools/index_tags.json

          This normally never fires: .githooks/pre-commit regenerates and stages
          these files on every commit.  If it fired, the hook is probably not
          enabled in your clone.  Enable it once with:

              git config core.hooksPath .githooks

          The generator indexes only git-tracked files, so it produces identical
          output in any clone or worktree — regenerating locally is safe and will
          match this job exactly.  The corrected files are attached to this run as
          the "regenerated-indexes" artifact if you would rather download them.
          EOF
          exit 1
      - name: Upload the corrected indexes for download
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regenerated-indexes
          path: |
            PROJECT_INDEX.md
            ARCHIVE_INDEX.md
            tools/index_tags.json
          if-no-files-found: ignore
