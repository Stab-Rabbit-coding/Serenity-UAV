# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: DevSkim

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '33 2 * * 2'

jobs:
  lint:
    name: DevSkim
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run DevSkim scanner
        uses: microsoft/DevSkim-Action@4b5047945a44163b94642a1cecc0d93a3f428cc6 # v1.0.16
        with:
          # DS187371 ("weak cipher mode") false-positives on the bare word "CMC" —
          # this project's own component abbreviation for a common-mode choke
          # (a real EMI-hardening part on every EMI-hardened board), not a
          # reference to a cipher mode. Confirmed 2026-07-03: every hit in this
          # PR was "CMC" in EE prose/schematic reference-designator text (e.g.
          # KiCad's generated `(property "Reference" "CMC" ...)` field, which
          # cannot be reworded without breaking the schematic). Most avoidable
          # prose usages were reworded to "common-mode choke" instead; this
          # exclusion covers the remaining unavoidable case and any future
          # recurrence of this same false-positive class.
          exclude-rules: DS187371
          # Generated index artefacts are build output of tools/precommit_index.py
          # ("do not hand-edit them"), and the "Project/Archive Index sync" check
          # asserts they are byte-equal to that generator's output.  They catalogue
          # every path and document title in the repo, so they necessarily contain
          # the literal strings "TODO.md" / "WBS.md" — which DS176209 ("suspicious
          # comment", severity note) flags as leftover TODO comments.  Confirmed
          # 2026-08-09 on PR #180: alerts 942/945 pointed at the substring "TODO"
          # inside the indexed path "tools/TODO.md" and inside the indexed title
          # "WBS.md / TODO.md Federation Inventory (Rev S2)" — filenames, not
          # comments.  The text cannot be reworded (any hand-edit breaks the sync
          # check and is reverted by the next regeneration), and it recurs on every
          # PR that adds a file, so the generated artefacts are excluded by PATH
          # rather than disabling DS176209 repo-wide — leftover-TODO detection stays
          # active in real source.
          # NOTE: this list REPLACES the action's default ignore-globs, so the
          # upstream defaults (**/.git/**,**/bin/**) are repeated here explicitly.
          ignore-globs: '**/.git/**,**/bin/**,**/PROJECT_INDEX.md,**/ARCHIVE_INDEX.md,**/tools/index_tags.json'

      - name: Upload DevSkim scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@e60ea984bd3baa95954f2856bcf24f9eaba46637 # v3.37.5
        with:
          sarif_file: devskim-results.sarif
