<text x="60" y="684" font-size="13" fill="#222">Waterjet the 8 A1b backbone cheeks (2 per leg).</text>
<circle cx="40" cy="701" r="11" fill="#e8892a"/><text x="40" y="706" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">5</text>
<text x="60" y="706" font-size="13" fill="#222">Cut the keel segments and the 2 ring-frame profiles.</text>
<rect x="20" y="760" width="1160" height="37" rx="5" fill="#ffffff" stroke="#b3261e" stroke-width="2"/>
<text x="32" y="777" font-size="12" font-weight="bold" fill="#b3261e">WARNING</text>
<text x="110" y="777" font-size="12" fill="#222">CF dust is a respiratory and eye hazard. Wear an N95 and safety glasses; cut outdoors or with dust extraction.</text>
<rect x="20" y="803" width="1160" height="37" rx="5" fill="#ffffff" stroke="#c77700" stroke-width="2"/>
<text x="32" y="820" font-size="12" font-weight="bold" fill="#c77700">CAUTION</text>
<text x="110" y="820" font-size="12" fill="#222">Never print the tilt pinion. A printed pinion is below the 76 MPa allowable (NACELLE_64MM_VERIFICATION 5c).</text>
