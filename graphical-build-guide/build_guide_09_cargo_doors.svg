<text x="28" y="592" font-size="15" font-weight="bold" fill="#1f2a36">INSTRUCTIONS</text>
<circle cx="40" cy="613" r="11" fill="#e8892a"/><text x="40" y="618" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">1</text>
<text x="60" y="618" font-size="13" fill="#222">Hang both doors on the hinge retention; they lap at the seam.</text>
<circle cx="40" cy="635" r="11" fill="#e8892a"/><text x="40" y="640" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">2</text>
<text x="60" y="640" font-size="13" fill="#222">Fit each bell-crank on its pivot pin in its fixed bracket; the port crank carries the latch</text>
<text x="60" y="657" font-size="13" fill="#222">hook.</text>
<circle cx="40" cy="674" r="11" fill="#e8892a"/><text x="40" y="679" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">3</text>
<text x="60" y="679" font-size="13" fill="#222">Fit the door horns and pushrods.</text>
<circle cx="40" cy="696" r="11" fill="#e8892a"/><text x="40" y="701" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">4</text>
<text x="60" y="701" font-size="13" fill="#222">Mount the door and release servos on their brackets; wire them to the door gateway.</text>
<circle cx="40" cy="718" r="11" fill="#e8892a"/><text x="40" y="723" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">5</text>
<text x="60" y="723" font-size="13" fill="#222">Check that the hook drops into its fixed mortise with the doors closed.</text>
<rect x="20" y="760" width="1160" height="37" rx="5" fill="#ffffff" stroke="#2b5c8a" stroke-width="2"/>
<text x="32" y="777" font-size="12" font-weight="bold" fill="#2b5c8a">NOTE</text>
<text x="110" y="777" font-size="12" fill="#222">The servos are bus-networked through their own gateway, not driven from a local H-bridge.</text>
