<text x="28" y="592" font-size="15" font-weight="bold" fill="#1f2a36">INSTRUCTIONS</text>
<circle cx="40" cy="613" r="11" fill="#e8892a"/><text x="40" y="618" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">1</text>
<text x="60" y="618" font-size="13" fill="#222">Press the throat onto the pod exit; fit the unison ring over the throat housing.</text>
<circle cx="40" cy="635" r="11" fill="#e8892a"/><text x="40" y="640" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">2</text>
<text x="60" y="640" font-size="13" fill="#222">Hang 8 flaps alternating master and seal; each seal laps 0.2 mm outboard.</text>
<circle cx="40" cy="657" r="11" fill="#e8892a"/><text x="40" y="662" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">3</text>
<text x="60" y="662" font-size="13" fill="#222">Mount the servo forward of the ring; fit the pull-only slotted link (slot &gt;= full stroke).</text>
<circle cx="40" cy="679" r="11" fill="#e8892a"/><text x="40" y="684" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">4</text>
<text x="60" y="684" font-size="13" fill="#222">Fit the torsion spring and the hard 105 % stop.</text>
<circle cx="40" cy="701" r="11" fill="#e8892a"/><text x="40" y="706" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">5</text>
<text x="60" y="706" font-size="13" fill="#222">Fail-safe: servo unpowered, push the ring to 75 % and release; it returns to 105 % every time.</text>
<rect x="20" y="760" width="1160" height="52" rx="5" fill="#ffffff" stroke="#c77700" stroke-width="2"/>
<text x="32" y="777" font-size="12" font-weight="bold" fill="#c77700">CAUTION</text>
<text x="110" y="777" font-size="12" fill="#222">Never run the nozzle schedule with the EDFs spinning until the gateway fault logic (105 % command, then load-switch trip) is</text>
<text x="110" y="792" font-size="12" fill="#222">bench-verified.</text>
<rect x="20" y="818" width="1160" height="37" rx="5" fill="#ffffff" stroke="#2b5c8a" stroke-width="2"/>
<text x="32" y="835" font-size="12" font-weight="bold" fill="#2b5c8a">NOTE</text>
<text x="110" y="835" font-size="12" fill="#222">The nozzle is not yet a placed part in the assembly (coverage gap); the render shows the hover-attitude starboard pod exit.</text>
