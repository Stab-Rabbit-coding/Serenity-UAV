<text x="878" y="338" font-size="13" fill="#222">bracket, six-start worm, 40T wheel</text>
<text x="878" y="354" font-size="11" fill="#7a6f5c">PRINT-TILT-*</text>
<text x="28" y="592" font-size="15" font-weight="bold" fill="#1f2a36">INSTRUCTIONS</text>
<circle cx="40" cy="613" r="11" fill="#e8892a"/><text x="40" y="618" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">1</text>
<text x="60" y="618" font-size="13" fill="#222">Mount each bracket on its three shell feet.</text>
<circle cx="40" cy="635" r="11" fill="#e8892a"/><text x="40" y="640" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">2</text>
<text x="60" y="640" font-size="13" fill="#222">Fit the worm, mesh the 40T wheel, and grub-screw the wheel to the 4 mm shaft.</text>
<circle cx="40" cy="657" r="11" fill="#e8892a"/><text x="40" y="662" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">3</text>
<text x="60" y="662" font-size="13" fill="#222">Mount the gearmotor; wire it through its own fused feed to the tilt controller.</text>
<circle cx="40" cy="679" r="11" fill="#e8892a"/><text x="40" y="684" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">4</text>
<text x="60" y="684" font-size="13" fill="#222">Fit the brake solenoid on its guide (mirrored guide on starboard).</text>
<circle cx="40" cy="701" r="11" fill="#e8892a"/><text x="40" y="706" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">5</text>
<text x="60" y="706" font-size="13" fill="#222">Brake check: motor unpowered, the pin locks the worm collar against hand load.</text>
<rect x="20" y="760" width="1160" height="37" rx="5" fill="#ffffff" stroke="#c77700" stroke-width="2"/>
<text x="32" y="777" font-size="12" font-weight="bold" fill="#c77700">CAUTION</text>
<text x="110" y="777" font-size="12" fill="#222">The worm train is NOT self-locking. Never leave a nacelle unbraked and unpowered under load: it will back-drive.</text>
