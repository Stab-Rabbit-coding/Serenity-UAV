<text x="28" y="592" font-size="15" font-weight="bold" fill="#1f2a36">INSTRUCTIONS</text>
<circle cx="40" cy="613" r="11" fill="#e8892a"/><text x="40" y="618" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">1</text>
<text x="60" y="618" font-size="13" fill="#222">Bond the keel segments into the cargo and rear sections only (head and middle are keelless).</text>
<circle cx="40" cy="635" r="11" fill="#e8892a"/><text x="40" y="640" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">2</text>
<text x="60" y="640" font-size="13" fill="#222">Lap-splice the two keel segments 3.9 in (100 mm) at the middle/rear joint.</text>
<circle cx="40" cy="657" r="11" fill="#e8892a"/><text x="40" y="662" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">3</text>
<text x="60" y="662" font-size="13" fill="#222">Bond the two ring frames into their keel notches.</text>
<circle cx="40" cy="679" r="11" fill="#e8892a"/><text x="40" y="684" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">4</text>
<text x="60" y="684" font-size="13" fill="#222">Bond each splice collar into both neighboring shells; clamp and cure.</text>
<rect x="20" y="760" width="1160" height="52" rx="5" fill="#ffffff" stroke="#2b5c8a" stroke-width="2"/>
<text x="32" y="777" font-size="12" font-weight="bold" fill="#2b5c8a">NOTE</text>
<text x="110" y="777" font-size="12" fill="#222">Keel and frame stations in the guide are still in the R1 datum; re-derive them in R2 before cutting notches (WBS 1.5.6 re-</text>
<text x="110" y="792" font-size="12" fill="#222">audit).</text>
