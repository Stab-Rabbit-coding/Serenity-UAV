<text x="60" y="640" font-size="13" fill="#222">Leg 2: through the FIXED 20 mm spar bore; the 4-wire bundle twists freely through tilt.</text>
<circle cx="40" cy="657" r="11" fill="#e8892a"/><text x="40" y="662" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">3</text>
<text x="60" y="662" font-size="13" fill="#222">Leg 3: spar bore to the nacelle 10 AWG disconnect bay (pod Z 2.27 in / 57.6 mm).</text>
<circle cx="40" cy="679" r="11" fill="#e8892a"/><text x="40" y="684" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">4</text>
<text x="60" y="684" font-size="13" fill="#222">Leg 4: disconnect bay to each ESC, strain-relieved: ROUTE NOT YET DRAWN (WA-R10).</text>
<circle cx="40" cy="701" r="11" fill="#e8892a"/><text x="40" y="706" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">5</text>
<text x="60" y="706" font-size="13" fill="#222">Close each ESC bay with its own cover (4 distinct).</text>
<rect x="20" y="760" width="1160" height="52" rx="5" fill="#ffffff" stroke="#c77700" stroke-width="2"/>
<text x="32" y="777" font-size="12" font-weight="bold" fill="#c77700">CAUTION</text>
<text x="110" y="777" font-size="12" fill="#222">Before cutting leads, measure the real run from PDB to each ESC, confirm it is within 11.8 in (300 mm), and check that nothing</text>
<text x="110" y="792" font-size="12" fill="#222">chafes at the trunnion through the full -5 to 135 deg travel.</text>
