<text x="28" y="48" font-size="26" font-weight="bold" fill="#fff">COMPONENTS OVERVIEW — REV T+</text>
<text x="28" y="70" font-size="13" fill="#d6dee6">Rendered from the FreeCAD master assembly; port nacelle at cruise, starboard at hover.</text>
<image x="20" y="96" width="700" height="408" xlink:href="card-renders/components.png" href="card-renders/components.png" preserveAspectRatio="xMidYMid meet"/>
<text x="740" y="112" font-size="14" font-weight="bold" fill="#e8892a">Hull</text>
<text x="740" y="130" font-size="12" fill="#222">4 printed sections + 3 splice collars, foam-</text>
<text x="740" y="145" font-size="12" fill="#222">filled, 24.00 in (609.6 mm)</text>
<text x="740" y="172" font-size="14" font-weight="bold" fill="#e8892a">Wing</text>
<text x="740" y="190" font-size="12" fill="#222">S1223-derived; FIXED bonded 20 mm CF spar; bonded</text>
<text x="740" y="205" font-size="12" fill="#222">root flanges</text>
<text x="740" y="232" font-size="14" font-weight="bold" fill="#e8892a">Nacelle</text>
<text x="740" y="250" font-size="12" fill="#222">64 mm tandem-EDF pod on a 2 x 6704ZZ trunnion</text>
<text x="740" y="277" font-size="14" font-weight="bold" fill="#e8892a">Tilt</text>
<text x="740" y="295" font-size="12" fill="#222">20D 25:1 + six-start worm, pin brake, 14T/50T;</text>
<text x="740" y="310" font-size="12" fill="#222">stops -5/135 deg</text>
<text x="740" y="337" font-size="14" font-weight="bold" fill="#e8892a">Nozzle</text>
<text x="740" y="355" font-size="12" fill="#222">Rev T3 shingled 8-flap; servo on measured tilt;</text>
<text x="740" y="370" font-size="12" fill="#222">spring to 105 %</text>
<text x="740" y="397" font-size="14" font-weight="bold" fill="#e8892a">Gear</text>
<text x="740" y="415" font-size="12" fill="#222">3.0 in (76 mm) R6 legs, A1b couple, 4 conforming</text>
<text x="740" y="430" font-size="12" fill="#222">bays</text>
<text x="740" y="457" font-size="14" font-weight="bold" fill="#e8892a">Cargo</text>
<text x="740" y="475" font-size="12" fill="#222">Lapped clamshell doors, bell-crank latch, door</text>
<text x="740" y="490" font-size="12" fill="#222">gateway, winch</text>
<text x="740" y="517" font-size="14" font-weight="bold" fill="#e8892a">Avionics</text>
<text x="740" y="535" font-size="12" fill="#222">8 PB2-I nodes (4 Pilot + 4 TACCO) + Observer,</text>
<text x="740" y="550" font-size="12" fill="#222">Flight Engineer, Commo</text>
<text x="740" y="577" font-size="14" font-weight="bold" fill="#e8892a">Power</text>
<text x="740" y="595" font-size="12" fill="#222">Flight Engineer PDB -&gt; 10 AWG through the spar -&gt;</text>
<text x="740" y="610" font-size="12" fill="#222">nacelle ESCs</text>
<text x="740" y="637" font-size="14" font-weight="bold" fill="#e8892a">C2</text>
<text x="740" y="655" font-size="12" fill="#222">Wi-Fi, Zigbee, mLRS (TACCO); SiK 915 MHz, 49 MHz</text>
<text x="740" y="670" font-size="12" fill="#222">(Commo)</text>
<text x="28" y="724" font-size="11" fill="#555">SOURCE: REVN_BUILD_GUIDE_24IN.md Rev T+ Configuration; authority documents listed there.</text>
