<text x="60" y="618" font-size="13" fill="#222">Seat the trunnion with its 6704ZZ pair on the fixed spar at the wing tip.</text>
<circle cx="40" cy="635" r="11" fill="#e8892a"/><text x="40" y="640" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">2</text>
<text x="60" y="640" font-size="13" fill="#222">Run the 4 mm shaft out through its bushings; mesh the 14T pinion with the 50T ring gear.</text>
<circle cx="40" cy="657" r="11" fill="#e8892a"/><text x="40" y="662" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">3</text>
<text x="60" y="662" font-size="13" fill="#222">Fit the AK7455 at the trunnion ring magnet.</text>
<circle cx="40" cy="679" r="11" fill="#e8892a"/><text x="40" y="684" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">4</text>
<text x="60" y="684" font-size="13" fill="#222">Fit the hard stops at -5 and 140 deg.</text>
<circle cx="40" cy="701" r="11" fill="#e8892a"/><text x="40" y="706" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">5</text>
<text x="60" y="706" font-size="13" fill="#222">Command -5 -&gt; 90 -&gt; 135 deg and back; set soft limits to -5 and 135 deg.</text>
