<text x="32" y="777" font-size="12" font-weight="bold" fill="#b3261e">WARNING</text>
<text x="110" y="777" font-size="12" fill="#222">EDFs on bench power can cut fingers. Keep hands, tools, and clothing clear of the duct during the rotation test.</text>
