<text x="60" y="618" font-size="13" fill="#222">Bench-test rotation: port CW from the intake, starboard CCW; swap two phases to reverse.</text>
<circle cx="40" cy="635" r="11" fill="#e8892a"/><text x="40" y="640" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">2</text>
<text x="60" y="640" font-size="13" fill="#222">Stage 1 (fore): pod Z 1.20-4.06 in (30.5-103.2 mm); stator/mount 1.66-4.06 in (42.2-103.2 mm).</text>
<circle cx="40" cy="657" r="11" fill="#e8892a"/><text x="40" y="662" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">3</text>
<text x="60" y="662" font-size="13" fill="#222">Stage 2 (aft): pod Z 4.10-6.96 in (104.2-176.9 mm); hold the 0.04 in (1.0 mm) interstage gap.</text>
<circle cx="40" cy="679" r="11" fill="#e8892a"/><text x="40" y="684" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">4</text>
<text x="60" y="684" font-size="13" fill="#222">Bolt each motor to its stator (4 x M3 on O16 mm, VERIFY); fit stage 2 first.</text>
<circle cx="40" cy="701" r="11" fill="#e8892a"/><text x="40" y="706" font-size="12" font-weight="bold" fill="#1f2a36" text-anchor="middle">5</text>
<text x="60" y="706" font-size="13" fill="#222">Route phase leads along the vanes to the ESC bays (from Z 3.40 in / 86.35 mm aft).</text>
